name: EsotericTrips Patch Checks

on:
  push:
    branches:
      - leon-google-calendar-meet
  pull_request:

jobs:
  php-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
      - name: PHP syntax check
        run: |
          php -l application/config/google.php
          php -l application/controllers/Google.php
          php -l application/libraries/Availability.php
          php -l application/libraries/Google_sync.php
          php -l application/libraries/Synchronization.php

      - name: Build EsotericTrips one-click patch ZIP
        run: |
          rm -rf release
          mkdir -p release/patch/application/config
          mkdir -p release/patch/application/controllers
          mkdir -p release/patch/application/libraries
          cp application/config/google.php release/patch/application/config/google.php
          cp application/controllers/Google.php release/patch/application/controllers/Google.php
          cp application/controllers/Calendar.php release/patch/application/controllers/Calendar.php
          cp application/libraries/Availability.php release/patch/application/libraries/Availability.php
          cp application/libraries/Google_sync.php release/patch/application/libraries/Google_sync.php
          cp application/libraries/Synchronization.php release/patch/application/libraries/Synchronization.php
          cp esoterictrips-patch-install.php release/esoterictrips-patch-install.php
          cat > release/README-INSTALL.txt <<'EOF'
EsotericTrips Easy!Appointments patch

1. Upload this ZIP to the Easy!Appointments installation directory.
2. Extract it there.
3. Open esoterictrips-patch-install.php in your browser.
4. Click INSTALL PATCH.
5. Test Google Meet and calendar conflict behaviour.
6. DELETE esoterictrips-patch-install.php and the patch directory after successful testing.

The installer preserves the existing root config.php and only adds the optional
EsotericTrips calendar-routing constants. It does not replace database or OAuth
credentials.
EOF
          cd release
          zip -r ../esoterictrips-ea-patch.zip .
      - name: Upload one-click patch artifact
        uses: actions/upload-artifact@v4
        with:
          name: esoterictrips-ea-patch
          path: esoterictrips-ea-patch.zip
          if-no-files-found: error
